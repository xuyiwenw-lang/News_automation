name: Daily news cleaning

on:
  schedule:
    - cron: '17 1 * * *' # UTC 01:17 = 北京时间 09:17
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-cleaning
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Run pipeline
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_SOURCE_TABLE_ID: ${{ secrets.FEISHU_SOURCE_TABLE_ID }}
          FEISHU_DEST_TABLE_ID: ${{ secrets.FEISHU_DEST_TABLE_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_BASE_URL: ${{ vars.FEISHU_BASE_URL || 'https://open.feishu.cn/open-apis' }}
          NEWS_TIMEZONE: Asia/Shanghai
          NEWS_LOOKBACK_DAYS: ${{ vars.NEWS_LOOKBACK_DAYS || '7' }}
          PYTHONUNBUFFERED: '1'
        run: python main.py
